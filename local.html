<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>即刻备忘 · 本地版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #202124;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0 20px 40px;
        }
        .container { max-width: 600px; width: 100%; padding-top: 40px; }

        /* ----- 头部 ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 24px; font-weight: 300; letter-spacing: 1px; color: #5f6368; }
        .header h1 span { font-weight: 500; color: #1a73e8; }
        .toolbar { display: flex; gap: 8px; }
        .tool-btn {
            background: none;
            border: 1px solid #dadce0;
            font-size: 13px;
            color: #5f6368;
            cursor: pointer;
            padding: 5px 14px;
            border-radius: 16px;
            transition: background 0.15s;
        }
        .tool-btn:hover { background: #f1f3f4; }
        .tool-btn.danger { color: #d93025; border-color: #fce8e6; }
        .tool-btn.danger:hover { background: #fce8e6; }

        /* ----- 输入区 ----- */
        .input-wrapper { margin-bottom: 28px; }
        .input-wrapper input {
            width: 100%;
            padding: 16px 22px;
            font-size: 17px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,0.08);
            transition: box-shadow 0.2s, border-color 0.2s;
            color: #202124;
        }
        .input-wrapper input:focus {
            border-color: #1a73e8;
            box-shadow: 0 1px 8px rgba(26,115,232,0.2);
        }
        .input-wrapper input::placeholder { color: #9aa0a6; font-weight: 300; }

        /* ----- 列表 ----- */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8eaed;
            margin-bottom: 8px;
        }
        .list-header h2 { font-size: 16px; font-weight: 400; color: #5f6368; }
        .list-header .count { font-size: 13px; color: #5f6368; background: #f1f3f4; padding: 3px 10px; border-radius: 12px; }

        .memo-list { list-style: none; }
        .memo-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px solid #f1f3f4;
            animation: fadeIn 0.2s ease;
        }
        .memo-item:last-child { border-bottom: none; }
        .memo-content {
            font-size: 16px;
            color: #202124;
            word-break: break-word;
            line-height: 1.5;
        }
        .memo-time {
            font-size: 12px;
            color: #9aa0a6;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .memo-delete {
            background: none;
            border: none;
            color: #9aa0a6;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }
        .memo-delete:hover { color: #d93025; background: #fce8e6; }
        .empty-state {
            text-align: center;
            color: #9aa0a6;
            padding: 60px 0;
            font-size: 15px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* ----- Toast ----- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 480px) {
            .container { padding-top: 24px; }
            .input-wrapper input { font-size: 16px; padding: 14px 18px; }
            .memo-item { grid-template-columns: 1fr auto auto; gap: 8px; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <div class="header">
        <h1>📝 <span>即刻</span>备忘</h1>
        <div class="toolbar">
            <button class="tool-btn" id="exportBtn" title="导出全部数据为 JSON 文件">导出</button>
            <button class="tool-btn" id="importBtn" title="从 JSON 文件导入数据">导入</button>
            <input type="file" id="importFile" accept=".json" style="display:none">
            <button class="tool-btn danger" id="clearBtn" title="清空全部备忘">清空</button>
        </div>
    </div>

    <!-- 输入 -->
    <div class="input-wrapper">
        <input type="text" id="memoInput" placeholder="输入你的想法或提醒，回车记录..." autofocus>
    </div>

    <!-- 列表 -->
    <div class="list-header">
        <h2>全部备忘</h2>
        <span class="count" id="totalCount">0</span>
    </div>
    <ul class="memo-list" id="memoListContainer">
        <li class="empty-state">还没有备忘，在上面输入第一条吧</li>
    </ul>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

</div>

<script>
    (function() {
        var STORAGE_KEY = 'instant_memo_local';

        // DOM
        var memoInput = document.getElementById('memoInput');
        var memoListContainer = document.getElementById('memoListContainer');
        var totalCount = document.getElementById('totalCount');
        var toast = document.getElementById('toast');
        var exportBtn = document.getElementById('exportBtn');
        var importBtn = document.getElementById('importBtn');
        var importFile = document.getElementById('importFile');
        var clearBtn = document.getElementById('clearBtn');

        // ---------- 数据层 ----------
        function loadMemos() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveMemos(memos) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
        }

        function generateId() {
            return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
        }

        // ---------- Toast ----------
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 1600);
        }

        // ---------- 操作 ----------
        function addMemo(content) {
            if (!content.trim()) {
                showToast('内容不能为空');
                return;
            }

            var memos = loadMemos();
            memos.unshift({
                id: generateId(),
                content: content.trim(),
                created_at: new Date().toISOString()
            });
            saveMemos(memos);

            memoInput.value = '';
            memoInput.focus();
            showToast('✓ 已记录');
            renderList();
        }

        function deleteMemo(id) {
            if (!confirm('确定删除这条备忘？')) return;

            var memos = loadMemos();
            memos = memos.filter(function(m) { return m.id !== id; });
            saveMemos(memos);
            showToast('已删除');
            renderList();
        }

        function clearAll() {
            var memos = loadMemos();
            if (memos.length === 0) return;
            if (!confirm('确定要清空全部 ' + memos.length + ' 条备忘吗？此操作不可恢复。')) return;

            saveMemos([]);
            showToast('已清空');
            renderList();
        }

        // ---------- 导入/导出 ----------
        function exportData() {
            var memos = loadMemos();
            if (memos.length === 0) {
                showToast('没有数据可导出');
                return;
            }

            var blob = new Blob([JSON.stringify({ memos: memos }, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'instant-memo-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已导出 ' + memos.length + ' 条备忘');
        }

        function importData(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    if (!data.memos || !Array.isArray(data.memos)) {
                        showToast('文件格式不正确');
                        return;
                    }

                    var existing = loadMemos();
                    var existingIds = {};
                    existing.forEach(function(m) { existingIds[m.id] = true; });

                    var added = 0;
                    data.memos.forEach(function(m) {
                        if (!m.id || !m.content) return;
                        if (existingIds[m.id]) return; // 跳过重复

                        existing.push({
                            id: m.id,
                            content: m.content,
                            created_at: m.created_at || new Date().toISOString()
                        });
                        existingIds[m.id] = true;
                        added++;
                    });

                    // 按时间倒序
                    existing.sort(function(a, b) {
                        return new Date(b.created_at) - new Date(a.created_at);
                    });

                    saveMemos(existing);
                    showToast('导入了 ' + added + ' 条备忘');
                    renderList();
                } catch (err) {
                    showToast('文件解析失败');
                }
            };
            reader.readAsText(file);
            // 重置 input 以便重复选择同一文件
            importFile.value = '';
        }

        // ---------- 渲染 ----------
        function renderEmpty(message) {
            memoListContainer.innerHTML = '';
            var li = document.createElement('li');
            li.className = 'empty-state';
            li.textContent = message;
            memoListContainer.appendChild(li);
        }

        function renderList() {
            var memos = loadMemos();
            totalCount.textContent = memos.length;

            if (memos.length === 0) {
                renderEmpty('还没有备忘，在上面输入第一条吧');
                return;
            }

            var fragment = document.createDocumentFragment();
            memos.forEach(function(item) {
                var li = document.createElement('li');
                li.className = 'memo-item';

                var contentSpan = document.createElement('span');
                contentSpan.className = 'memo-content';
                contentSpan.textContent = item.content;

                var timeSpan = document.createElement('span');
                timeSpan.className = 'memo-time';
                var date = new Date(item.created_at);
                var pad = function(n) { return String(n).padStart(2, '0'); };
                timeSpan.textContent =
                    date.getFullYear() + '-' +
                    pad(date.getMonth() + 1) + '-' +
                    pad(date.getDate()) + ' ' +
                    pad(date.getHours()) + ':' +
                    pad(date.getMinutes());

                var deleteBtn = document.createElement('button');
                deleteBtn.className = 'memo-delete';
                deleteBtn.textContent = '✕';
                deleteBtn.title = '删除';
                deleteBtn.addEventListener('click', function() {
                    deleteMemo(item.id);
                });

                li.appendChild(contentSpan);
                li.appendChild(timeSpan);
                li.appendChild(deleteBtn);
                fragment.appendChild(li);
            });

            memoListContainer.innerHTML = '';
            memoListContainer.appendChild(fragment);
        }

        // ---------- 事件绑定 ----------
        memoInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addMemo(memoInput.value);
            }
        });

        exportBtn.addEventListener('click', exportData);
        importBtn.addEventListener('click', function() { importFile.click(); });
        importFile.addEventListener('change', function() {
            if (importFile.files[0]) { importData(importFile.files[0]); }
        });
        clearBtn.addEventListener('click', clearAll);

        // ---------- 启动 ----------
        renderList();
        memoInput.focus();
    })();
</script>
</body>
</html>
