<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>即刻备忘</title>
    <!-- Supabase JS 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        /* 全局重置与极简风格 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #202124;
            height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0 20px;
        }
        .container { max-width: 600px; width: 100%; }

        /* ----- 录入页 (首页) ----- */
        #page-add {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            min-height: 500px;
        }
        .app-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #5f6368;
            margin-bottom: 40px;
        }
        .app-title span { font-weight: 500; color: #1a73e8; }
        
        .input-wrapper {
            width: 100%;
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 18px 24px;
            font-size: 18px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            background: #fff;
            box-shadow: 0 1px 6px rgba(32,33,36,0.08);
            transition: box-shadow 0.2s, border-color 0.2s;
            color: #202124;
        }
        .input-wrapper input:focus {
            border-color: #1a73e8;
            box-shadow: 0 1px 8px rgba(26,115,232,0.2);
        }
        .input-wrapper input::placeholder { color: #9aa0a6; font-weight: 300; }
        
        .action-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 3px rgba(26,115,232,0.3);
        }
        .btn-primary:hover { background: #1557b0; box-shadow: 0 2px 6px rgba(26,115,232,0.4); }
        .btn-primary:active { transform: scale(0.97); }
        
        .btn-ghost {
            background: transparent;
            color: #5f6368;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 20px;
            transition: background 0.2s;
            text-decoration: underline 1px dashed #dadce0;
            text-underline-offset: 4px;
        }
        .btn-ghost:hover { background: #f1f3f4; }
        
        .toast {
            margin-top: 24px;
            color: #34a853;
            font-size: 14px;
            height: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }

        /* ----- 列表页 (查看) ----- */
        #page-list {
            display: none;
            flex-direction: column;
            padding-top: 30px;
            padding-bottom: 40px;
            min-height: 100vh;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #e8eaed;
            margin-bottom: 20px;
        }
        .list-header h2 { font-size: 22px; font-weight: 400; color: #202124; }
        .list-header .count { font-size: 14px; color: #5f6368; background: #f1f3f4; padding: 4px 12px; border-radius: 16px; }
        .back-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: #1a73e8;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #e8f0fe; }

        /* 列表项 */
        .memo-list { list-style: none; }
        .memo-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px solid #f1f3f4;
            animation: fadeIn 0.2s ease;
        }
        .memo-item:last-child { border-bottom: none; }
        .memo-content { 
            font-size: 16px; 
            color: #202124; 
            word-break: break-word; 
            padding-right: 16px;
            line-height: 1.5;
        }
        .memo-time { 
            font-size: 12px; 
            color: #9aa0a6; 
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .empty-state {
            text-align: center;
            color: #9aa0a6;
            padding: 60px 0;
            font-size: 15px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* 全局适配 */
        @media (max-width: 480px) {
            .input-wrapper input { font-size: 16px; padding: 16px 20px; }
            .app-title { font-size: 26px; }
            .memo-item { flex-direction: column; align-items: flex-start; gap: 4px; }
            .memo-time { align-self: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ========== 页面1：录入 ========== -->
    <div id="page-add">
        <div class="app-title">📝 <span>即刻</span>备忘</div>
        <div class="input-wrapper">
            <input type="text" id="memoInput" placeholder="输入你的想法或提醒..." autofocus>
        </div>
        <div class="action-row">
            <button class="btn-primary" id="saveBtn">记录</button>
            <button class="btn-ghost" id="goToListBtn">查看全部 →</button>
        </div>
        <div id="toastMessage" class="toast">✓ 已记录</div>
    </div>

    <!-- ========== 页面2：列表 ========== -->
    <div id="page-list">
        <div class="list-header">
            <button class="back-btn" id="backToAddBtn">← 返回</button>
            <h2>所有备忘</h2>
            <span class="count" id="totalCount">0</span>
        </div>
        <ul class="memo-list" id="memoListContainer">
            <!-- JS 动态渲染 -->
            <li class="empty-state">还没有备忘，去记录第一条吧</li>
        </ul>
    </div>
</div>

<script>
    (function() {
        // --------------------------------------------------------------
        // 1. 配置你的 Supabase (免费注册，获取 URL 和 anon key)
        // --------------------------------------------------------------
        const SUPABASE_URL = 'https://jocnignjppntkcndyvfi.supabase.co';       // 替换这里
        const SUPABASE_ANON_KEY = 'sb_publishable_k1WOgx7zI-nG_cHgXGPA-A_Obi-Ws6A';                   // 替换这里

        // --------------------------------------------------------------
        // 2. 初始化客户端 & 匿名登录 (免密码，自动跨设备)
        // --------------------------------------------------------------
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 全局状态
        let currentUserId = null;
        let allMemos = [];

        // DOM 元素
        const pageAdd = document.getElementById('page-add');
        const pageList = document.getElementById('page-list');
        const memoInput = document.getElementById('memoInput');
        const saveBtn = document.getElementById('saveBtn');
        const goToListBtn = document.getElementById('goToListBtn');
        const backToAddBtn = document.getElementById('backToAddBtn');
        const memoListContainer = document.getElementById('memoListContainer');
        const totalCount = document.getElementById('totalCount');
        const toast = document.getElementById('toastMessage');

        // 辅助：显示短暂提示
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        // 辅助：切换页面 (add / list)
        function showPage(page) {
            if (page === 'add') {
                pageAdd.style.display = 'flex';
                pageList.style.display = 'none';
                memoInput.focus();
            } else {
                pageAdd.style.display = 'none';
                pageList.style.display = 'flex';
                renderList(); // 每次切到列表页刷新数据
            }
        }

        // --------------------------------------------------------------
        // 3. 核心 API 操作
        // --------------------------------------------------------------
        // 3.1 初始化登录 (匿名)
        async function initAuth() {
            try {
                // 先尝试恢复已有会话
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    currentUserId = session.user.id;
                    console.log('✅ 已恢复会话:', currentUserId);
                    return;
                }

                // 没有会话则匿名登录
                const { data, error } = await supabase.auth.signInAnonymously();
                if (error) throw error;
                currentUserId = data.user.id;
                console.log('✅ 匿名登录成功:', currentUserId);
            } catch (err) {
                console.error('❌ 认证失败:', err.message);
                // 极端情况：展示错误但允许本地尝试（实际无法操作）
                alert('初始化连接失败，请检查网络或 Supabase 配置');
            }
        }

        // 3.2 新增备忘
        async function addMemo(content) {
            if (!content.trim()) {
                showToast('内容不能为空');
                return false;
            }
            if (!currentUserId) {
                showToast('未连接数据库，请刷新重试');
                return false;
            }

            const { data, error } = await supabase
                .from('memos')
                .insert([{ content: content.trim(), user_id: currentUserId }])
                .select();

            if (error) {
                console.error('插入失败:', error);
                showToast('保存失败，请稍后重试');
                return false;
            }
            showToast('✓ 已记录');
            memoInput.value = '';
            memoInput.focus();
            return true;
        }

        // 3.3 获取全部备忘 (按时间倒序)
        async function fetchMemos() {
            if (!currentUserId) return [];
            const { data, error } = await supabase
                .from('memos')
                .select('id, content, created_at')
                .eq('user_id', currentUserId)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('查询失败:', error);
                return [];
            }
            return data || [];
        }

        // --------------------------------------------------------------
        // 4. 渲染列表
        // --------------------------------------------------------------
        async function renderList() {
            // 显示加载中占位
            memoListContainer.innerHTML = '<li class="empty-state">加载中...</li>';
            
            allMemos = await fetchMemos();
            totalCount.textContent = allMemos.length;

            if (allMemos.length === 0) {
                memoListContainer.innerHTML = '<li class="empty-state">✨ 还没有备忘，去记录第一条吧</li>';
                return;
            }

            // 构建列表 HTML
            const fragment = document.createDocumentFragment();
            allMemos.forEach(item => {
                const li = document.createElement('li');
                li.className = 'memo-item';

                const contentSpan = document.createElement('span');
                contentSpan.className = 'memo-content';
                contentSpan.textContent = item.content;

                const timeSpan = document.createElement('span');
                timeSpan.className = 'memo-time';
                // 格式化时间：YYYY-MM-DD HH:mm
                const date = new Date(item.created_at);
                const pad = (n) => String(n).padStart(2, '0');
                timeSpan.textContent = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;

                li.appendChild(contentSpan);
                li.appendChild(timeSpan);
                fragment.appendChild(li);
            });
            memoListContainer.innerHTML = '';
            memoListContainer.appendChild(fragment);
        }

        // --------------------------------------------------------------
        // 5. 事件绑定
        // --------------------------------------------------------------
        // 保存 (按钮点击 & 回车)
        saveBtn.addEventListener('click', async () => {
            await addMemo(memoInput.value);
        });
        memoInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                await addMemo(memoInput.value);
            }
        });

        // 页面切换
        goToListBtn.addEventListener('click', () => showPage('list'));
        backToAddBtn.addEventListener('click', () => showPage('add'));

        // 全局快捷键：ESC 回到录入页 (在列表页时)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && pageList.style.display === 'flex') {
                showPage('add');
            }
        });

        // --------------------------------------------------------------
        // 6. 启动应用
        // --------------------------------------------------------------
        async function initApp() {
            await initAuth();
            // 默认显示录入页
            showPage('add');
            // 后台预加载一次列表数据，让切过去时更快
            if (currentUserId) {
                await fetchMemos(); 
            }
        }

        initApp();
    })();
</script>
</body>
</html>
