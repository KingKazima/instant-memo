<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>即刻备忘</title>
    <!-- Supabase JS 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        /* 全局重置与极简风格 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #202124;
            height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0 20px;
        }
        .container { max-width: 600px; width: 100%; }

        /* ----- 录入页 (首页) ----- */
        #page-add {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            min-height: 500px;
        }
        .app-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #5f6368;
            margin-bottom: 40px;
        }
        .app-title span { font-weight: 500; color: #1a73e8; }
        
        .input-wrapper {
            width: 100%;
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 18px 24px;
            font-size: 18px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            background: #fff;
            box-shadow: 0 1px 6px rgba(32,33,36,0.08);
            transition: box-shadow 0.2s, border-color 0.2s;
            color: #202124;
        }
        .input-wrapper input:focus {
            border-color: #1a73e8;
            box-shadow: 0 1px 8px rgba(26,115,232,0.2);
        }
        .input-wrapper input::placeholder { color: #9aa0a6; font-weight: 300; }
        
        .action-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 3px rgba(26,115,232,0.3);
        }
        .btn-primary:hover { background: #1557b0; box-shadow: 0 2px 6px rgba(26,115,232,0.4); }
        .btn-primary:active { transform: scale(0.97); }
        
        .toast {
            margin-top: 24px;
            color: #34a853;
            font-size: 14px;
            height: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }

        /* 全局适配 */
        @media (max-width: 480px) {
            .input-wrapper input { font-size: 16px; padding: 16px 20px; }
            .app-title { font-size: 26px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ========== 录入页 ========== -->
    <div id="page-add">
        <div class="app-title">📝 <span>即刻</span>备忘</div>
        <div class="input-wrapper">
            <input type="text" id="memoInput" placeholder="输入你的想法或提醒..." autofocus>
        </div>
        <div class="action-row">
            <button class="btn-primary" id="saveBtn">记录</button>
        </div>
        <div id="toastMessage" class="toast">✓ 已记录</div>
    </div>

</div>

<script>
    (function() {
        // --------------------------------------------------------------
        // 1. 配置你的 Supabase (免费注册，获取 URL 和 anon key)
        // --------------------------------------------------------------
        const SUPABASE_URL = 'https://jocnignjppntkcndyvfi.supabase.co';       // 替换这里
        const SUPABASE_ANON_KEY = 'sb_publishable_k1WOgx7zI-nG_cHgXGPA-A_Obi-Ws6A';                   // 替换这里

        // --------------------------------------------------------------
        // 2. 初始化客户端 & 匿名登录 (免密码，自动跨设备)
        // --------------------------------------------------------------
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 全局状态
        let currentUserId = null;
        // DOM 元素
        const memoInput = document.getElementById('memoInput');
        const saveBtn = document.getElementById('saveBtn');
        const toast = document.getElementById('toastMessage');

        // 辅助：显示短暂提示
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        // --------------------------------------------------------------
        // 3. 核心 API 操作
        // --------------------------------------------------------------
        // 3.1 初始化登录 (匿名)
        async function initAuth() {
            try {
                // 先尝试恢复已有会话
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    currentUserId = session.user.id;
                    console.log('✅ 已恢复会话:', currentUserId);
                    return;
                }

                // 没有会话则匿名登录
                const { data, error } = await supabase.auth.signInAnonymously();
                if (error) throw error;
                currentUserId = data.user.id;
                console.log('✅ 匿名登录成功:', currentUserId);
            } catch (err) {
                console.error('❌ 认证失败:', err.message);
                // 极端情况：展示错误但允许本地尝试（实际无法操作）
                alert('初始化连接失败，请检查网络或 Supabase 配置');
            }
        }

        // 3.2 新增备忘
        async function addMemo(content) {
            if (!content.trim()) {
                showToast('内容不能为空');
                return false;
            }
            if (!currentUserId) {
                showToast('未连接数据库，请刷新重试');
                return false;
            }

            const { data, error } = await supabase
                .from('memos')
                .insert([{ content: content.trim(), user_id: currentUserId }])
                .select();

            if (error) {
                console.error('插入失败:', error);
                showToast('保存失败，请稍后重试');
                return false;
            }
            showToast('✓ 已记录');
            memoInput.value = '';
            memoInput.focus();
            return true;
        }

        // --------------------------------------------------------------
        // 4. 事件绑定
        // --------------------------------------------------------------
        // 保存 (按钮点击 & 回车)
        saveBtn.addEventListener('click', async () => {
            await addMemo(memoInput.value);
        });
        memoInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                await addMemo(memoInput.value);
            }
        });

        // --------------------------------------------------------------
        // 5. 启动应用
        // --------------------------------------------------------------
        async function initApp() {
            await initAuth();
            memoInput.focus();
        }

        initApp();
    })();
</script>
</body>
</html>
